[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxagentbot"
version = "0.1.0"
description = "Linux WeChat AT-SPI bridge for the official Codex Python SDK"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
bridge = ["PyYAML>=6,<7", "openai-codex", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
wxagentbot = "wxagentbot.cli:main"

[tool.setuptools.packages.find]
include = ["wxagentbot*"]
